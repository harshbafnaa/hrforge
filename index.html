<body class="bg-slate-50 text-slate-900 antialiased">

<script>
  // =============================================================================
  // Tailwind theme — deep indigo brand accent
  // =============================================================================
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            50:'#f1efff', 100:'#e2dffe', 200:'#c5bcfd', 300:'#a59afb',
            400:'#7d6cf0', 500:'#5e48d6', 600:'#3C28B4', 700:'#2f1f8c',
            800:'#251879', 900:'#1a1057',
          },
        },
      },
    },
  };

  // =============================================================================
  // Constants
  // =============================================================================
  const STAGES = [
    { id: 'applied',    name: 'Applied',    color: 'bg-slate-100 text-slate-700 border-slate-200' },
    { id: 'screening',  name: 'Screening',  color: 'bg-blue-100 text-blue-700 border-blue-200' },
    { id: 'interview',  name: 'Interview',  color: 'bg-amber-100 text-amber-700 border-amber-200' },
    { id: 'offer',      name: 'Offer',      color: 'bg-purple-100 text-purple-700 border-purple-200' },
    { id: 'hired',      name: 'Hired',      color: 'bg-emerald-100 text-emerald-700 border-emerald-200' },
    { id: 'rejected',   name: 'Rejected',   color: 'bg-rose-100 text-rose-700 border-rose-200' },
  ];
  const STAGE_BY_ID = Object.fromEntries(STAGES.map(s => [s.id, s]));

  const CLIENT_COLORS = [
    'bg-blue-500', 'bg-purple-500', 'bg-emerald-500', 'bg-amber-500',
    'bg-rose-500', 'bg-cyan-500', 'bg-indigo-500', 'bg-pink-500',
  ];

  // =============================================================================
  // App state
  // =============================================================================
  const state = {
    view: 'loading',
    params: {},
    user: null,
    activeClientId: null,
    data: { clients: [], jobs: [], candidates: [], applications: [] },
    error: null,
    info: null,
    submitting: false,
    aiLoading: {}, // { [taskId]: true }
    modal: null,
  };

  // =============================================================================
  // Supabase client + row mappers
  // =============================================================================
  let supabase = null;

  async function initSupabase() {
    let url, key;
    try {
      const r = await fetch('/api/config');
      if (r.ok) {
        const cfg = await r.json();
        url = cfg.supabaseUrl;
        key = cfg.supabaseAnonKey;
      }
    } catch {}
    if (!url || !key) {
      throw new Error('Supabase config missing. Set SUPABASE_URL and SUPABASE_ANON_KEY env vars in Vercel.');
    }
    supabase = window.supabase.createClient(url, key, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });
  }

  // snake_case (DB) <-> camelCase (JS) mappers
  function rowToClient(r) {
    return { id: r.id, name: r.name, industry: r.industry, colorIdx: r.color_idx ?? 0, status: r.status || 'active', createdAt: new Date(r.created_at).getTime() };
  }
  function rowToJob(r) {
    return { id: r.id, clientId: r.client_id, title: r.title, seniority: r.seniority || '', location: r.location || '', workMode: r.work_mode || '', priority: r.priority || 'medium', status: r.status || 'open', description: r.description || '', requirements: r.requirements || '', createdAt: new Date(r.created_at).getTime() };
  }
  function rowToCandidate(r) {
    return { id: r.id, name: r.name, email: r.email || '', phone: r.phone || '', currentRole: r.current_title || '', currentCompany: r.current_company || '', yearsExperience: r.years_experience, skills: r.skills || [], summary: r.summary || '', source: r.source || '', aiSummary: r.ai_summary || null, createdAt: new Date(r.created_at).getTime() };
  }
  function rowToApplication(r) {
    return { id: r.id, candidateId: r.candidate_id, jobId: r.job_id, stage: r.stage || 'applied', fitScore: r.fit_score, fitSummary: r.fit_summary, strengths: r.strengths || [], gaps: r.gaps || [], createdAt: new Date(r.created_at).getTime() };
  }

  // =============================================================================
  // Data layer — fetch + mutate against Supabase, with RLS (owner_id = auth.uid)
  // =============================================================================
  async function fetchAllData() {
    const [clientsRes, jobsRes, candidatesRes, applicationsRes] = await Promise.all([
      supabase.from('clients').select('*').order('created_at', { ascending: false }),
      supabase.from('jobs').select('*').order('created_at', { ascending: false }),
      supabase.from('candidates').select('*').order('created_at', { ascending: false }),
      supabase.from('applications').select('*').order('created_at', { ascending: false }),
    ]);
    for (const r of [clientsRes, jobsRes, candidatesRes, applicationsRes]) {
      if (r.error) throw new Error(r.error.message);
    }
    return {
      clients: (clientsRes.data || []).map(rowToClient),
      jobs: (jobsRes.data || []).map(rowToJob),
      candidates: (candidatesRes.data || []).map(rowToCandidate),
      applications: (applicationsRes.data || []).map(rowToApplication),
    };
  }

  async function reloadData() {
    state.data = await fetchAllData();
  }

  // =============================================================================
  // Auth helpers — Supabase Auth
  // =============================================================================
  async function getCurrentUser() {
    const { data } = await supabase.auth.getUser();
    if (!data?.user) return null;
    return {
      id: data.user.id,
      email: data.user.email,
      name: data.user.user_metadata?.name || data.user.email.split('@')[0],
    };
  }

  // =============================================================================
  // Utilities
  // =============================================================================
  const id = () => 'x' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const escapeHTML = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const initials = (s) => (s||'?').split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join('') || '?';
  const fmtDate = (ts) => new Date(ts).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
  const fmtRel = (ts) => {
    const diff = Date.now() - ts;
    const m = 60*1000, h = 60*m, d = 24*h;
    if (diff < m) return 'just now';
    if (diff < h) return Math.floor(diff/m) + ' min ago';
    if (diff < d) return Math.floor(diff/h) + 'h ago';
    if (diff < 7*d) return Math.floor(diff/d) + 'd ago';
    return fmtDate(ts);
  };

  function toast(msg, kind='info') {
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    const cls = kind === 'error'
      ? 'bg-red-600 text-white'
      : kind === 'success'
      ? 'bg-emerald-600 text-white'
      : 'bg-slate-900 text-white';
    el.className = `pointer-events-auto fade-in rounded-lg ${cls} px-4 py-2 text-sm shadow-lg`;
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity .2s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 220); }, 3500);
  }

  // =============================================================================
  // AI helpers — real calls to the Claude API
  // =============================================================================
  async function callClaude(system, user, { maxTokens = 1500 } = {}) {
    const resp = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: maxTokens,
        system,
        messages: [{ role: 'user', content: user }],
      }),
    });
    if (!resp.ok) {
      const t = await resp.text().catch(() => '');
      throw new Error(`Claude API ${resp.status}: ${t.slice(0, 200)}`);
    }
    const data = await resp.json();
    return data.content
      .filter((b) => b.type === 'text')
      .map((b) => b.text)
      .join('\n')
      .trim();
  }

  async function callClaudeJSON(system, user, opts = {}) {
    const text = await callClaude(system, user, opts);
    // Strip code fences and try to find a JSON object/array
    let cleaned = text.replace(/^```(?:json)?\s*/m, '').replace(/\s*```\s*$/m, '').trim();
    try { return JSON.parse(cleaned); } catch {}
    const objMatch = cleaned.match(/\{[\s\S]*\}/);
    if (objMatch) { try { return JSON.parse(objMatch[0]); } catch {} }
    throw new Error('AI returned invalid JSON. First 200 chars: ' + cleaned.slice(0, 200));
  }

  async function aiGenerateJD({ title, seniority, location, workMode, clientName, industry, brief }) {
    const system = `You are an expert recruiter writing precise, specific job descriptions.
Rules:
- 2-3 sentence "about the role" intro woven into the description
- 5-7 specific responsibilities (not generic)
- 5-6 must-have requirements (concrete: years, technologies, certifications)
- 3-4 nice-to-haves
- No clichés like "rockstar", "ninja", "hit the ground running", "fast-paced"
- Match the company context — a robotics company JD reads differently than a SaaS one
Return ONLY valid JSON, no preamble, with this shape:
{"description":"<markdown text with About + Responsibilities sections>","requirements":"<markdown text with Must-have + Nice-to-have sections>"}`;
    const userMsg = `Role: ${title}
Seniority: ${seniority || 'not specified'}
Location: ${location || 'not specified'}
Work mode: ${workMode || 'not specified'}
Company: ${clientName || 'not specified'}
Industry: ${industry || 'not specified'}
Brief: ${brief || '(no extra context provided)'}

Write the JD.`;
    return await callClaudeJSON(system, userMsg, { maxTokens: 2000 });
  }

  async function aiParseResume(resumeText) {
    const system = `Extract structured candidate data from this resume / LinkedIn / pasted profile text. Be conservative — if a field can't be confidently inferred, use null. Skills should be specific tools/technologies/methodologies, not soft skills. yearsExperience is a single integer (round to nearest year). Return ONLY valid JSON, no preamble, with this shape:
{"name": string|null, "email": string|null, "phone": string|null, "currentRole": string|null, "currentCompany": string|null, "yearsExperience": number|null, "skills": string[], "summary": "2-3 sentence neutral overview"}`;
    return await callClaudeJSON(system, resumeText, { maxTokens: 1200 });
  }

  async function aiFitScore({ candidate, job }) {
    const system = `You are an expert recruiter. Score this candidate's fit for this role on a 0-100 scale. Be honest — don't inflate. Heuristic weighting: skills match 40%, experience level alignment 30%, role/domain alignment 20%, trajectory/seniority 10%. Return ONLY valid JSON, no preamble:
{"score": <integer 0-100>, "summary": "<2 sentence overall fit>", "strengths": ["<3 specific strengths>"], "gaps": ["<2-3 specific gaps>"]}`;
    const candidateBlock = `Name: ${candidate.name}
Current role: ${candidate.currentRole || 'unknown'} at ${candidate.currentCompany || 'unknown'}
Experience: ${candidate.yearsExperience || 'unknown'} years
Skills: ${(candidate.skills || []).join(', ') || 'unknown'}
Summary: ${candidate.summary || 'none'}`;
    const jobBlock = `Title: ${job.title}
Seniority: ${job.seniority || 'unknown'}
Description: ${job.description || ''}
Requirements: ${job.requirements || ''}`;
    return await callClaudeJSON(system, `CANDIDATE:\n${candidateBlock}\n\nROLE:\n${jobBlock}\n\nScore the fit.`, { maxTokens: 800 });
  }

  async function aiInterviewQuestions(job) {
    const system = `Generate 7 interview questions for this role. Mix:
- 2 behavioral (STAR-friendly)
- 3 role-specific functional/technical
- 1 problem-solving
- 1 culture / motivation

For each, include what to look for in a strong answer. Return ONLY valid JSON, no preamble:
{"questions":[{"question":"...","competency":"<one of: communication, technical, problem-solving, leadership, culture, motivation>","lookFor":"<2 sentences on what a strong answer covers>"}]}`;
    return await callClaudeJSON(system, `Title: ${job.title}\nSeniority: ${job.seniority || 'unknown'}\nDescription: ${job.description}\nRequirements: ${job.requirements}`, { maxTokens: 1800 });
  }

  async function aiCandidateSummary({ candidate, applications, jobs }) {
    const apps = applications.map(a => {
      const j = jobs.find(x => x.id === a.jobId);
      return j ? `- ${j.title} (stage: ${a.stage}${a.fitScore ? ', AI fit: ' + a.fitScore : ''})` : null;
    }).filter(Boolean).join('\n') || 'No active applications.';
    const system = `Write a concise executive summary of this candidate (~80 words, 1 paragraph) suitable for sharing with a hiring manager. Lead with their strongest fit factor, mention their most relevant experience, and end with one consideration or watch-out. No headers, no markdown, no bullet points — just one tight paragraph.`;
    const user = `Candidate: ${candidate.name}
Current: ${candidate.currentRole || 'unknown'} at ${candidate.currentCompany || 'unknown'}
Experience: ${candidate.yearsExperience || 'unknown'} years
Skills: ${(candidate.skills || []).join(', ')}
Summary: ${candidate.summary || ''}

Active applications:
${apps}`;
    return await callClaude(system, user, { maxTokens: 400 });
  }

  async function loadOrSeedData() {
    let data = await fetchAllData();
    if (data.clients.length === 0 && data.jobs.length === 0 && data.candidates.length === 0) {
      await seedDemoDataIntoSupabase();
      data = await fetchAllData();
    }

  // =============================================================================
  // Auth handlers — Supabase Auth
  // =============================================================================
  async function handleSignup(formEl) {
    if (state.submitting) return;
    const fd = new FormData(formEl);
    const name = (fd.get('name')||'').toString().trim();
    const email = (fd.get('email')||'').toString().trim().toLowerCase();
    const password = (fd.get('password')||'').toString();
    const confirm = (fd.get('confirm')||'').toString();

    if (!name || name.length < 2) return showAuthErr('Please enter your full name.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showAuthErr('Please enter a valid email.');
    if (password.length < 8) return showAuthErr('Password must be at least 8 characters.');
    if (password !== confirm) return showAuthErr('Passwords do not match.');

    state.submitting = true; state.error = null; render();

    const { data, error } = await supabase.auth.signUp({
      email, password,
      options: { data: { name } },
    });
    if (error) { state.submitting = false; return showAuthErr(error.message); }

    // If email confirmation is OFF in Supabase, we'll have a session immediately.
    // If it's ON, the user has to click the email link — show them a message.
    if (!data.session) {
      state.submitting = false;
      state.error = null;
      state.info = 'Almost there — check your inbox for a confirmation link, then sign in.';
      state.view = 'login';
      render();
      return;
    }

    state.user = { id: data.user.id, email: data.user.email, name };
    try {
      state.data = await loadOrSeedData();
    } catch (e) {
      state.submitting = false;
      return showAuthErr('Sign-up succeeded, but loading workspace failed: ' + e.message);
    }
    state.activeClientId = null;
    state.view = 'dashboard';
    state.submitting = false;
    state.error = null;
    state.info = `Welcome, ${name.split(' ')[0]}! We've seeded your workspace with demo clients to explore.`;
    render();
  }

  async function handleLogin(formEl) {
    if (state.submitting) return;
    const fd = new FormData(formEl);
    const email = (fd.get('email')||'').toString().trim().toLowerCase();
    const password = (fd.get('password')||'').toString();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showAuthErr('Please enter a valid email.');
    if (!password) return showAuthErr('Please enter your password.');

    state.submitting = true; state.error = null; render();
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { state.submitting = false; return showAuthErr(error.message); }

    state.user = {
      id: data.user.id,
      email: data.user.email,
      name: data.user.user_metadata?.name || data.user.email.split('@')[0],
    };
    try {
      state.data = await loadOrSeedData();
    } catch (e) {
      state.submitting = false;
      return showAuthErr('Sign-in succeeded, but loading workspace failed: ' + e.message);
    }
    state.activeClientId = null;
    state.view = 'dashboard';
    state.submitting = false;
    state.error = null;
    state.info = `Welcome back, ${state.user.name.split(' ')[0]}.`;
    render();
  }

  async function handleSignout() {
    await supabase.auth.signOut();
    state.user = null;
    state.data = { clients: [], jobs: [], candidates: [], applications: [] };
    state.activeClientId = null;
    state.view = 'login';
    state.error = null;
    state.info = 'Signed out.';
    render();
  }

  function showAuthErr(msg) { state.error = msg; state.info = null; render(); }

  // =============================================================================
  // Navigation
  // =============================================================================
  function go(view, params = {}) {
    state.view = view;
    state.params = params;
    state.error = null;
    state.info = null;
    window.scrollTo(0, 0);
    render();
  }

  // =============================================================================
  // Mutations — write to Supabase, then update local state from returned row
  // =============================================================================
  async function createClient({ name, industry }) {
    const colorIdx = state.data.clients.length % CLIENT_COLORS.length;
    const { data, error } = await supabase.from('clients').insert({
      name, industry, color_idx: colorIdx, status: 'active',
    }).select().single();
    if (error) { toast('Create client failed: ' + error.message, 'error'); return null; }
    const c = rowToClient(data);
    state.data.clients.unshift(c);
    return c;
  }

  async function createJob(payload) {
    const row = {
      client_id: payload.clientId,
      title: payload.title,
      seniority: payload.seniority || null,
      location: payload.location || null,
      work_mode: payload.workMode || null,
      priority: payload.priority || 'medium',
      status: payload.status || 'open',
      description: payload.description || '',
      requirements: payload.requirements || '',
    };
    const { data, error } = await supabase.from('jobs').insert(row).select().single();
    if (error) { toast('Create job failed: ' + error.message, 'error'); return null; }
    const j = rowToJob(data);
    state.data.jobs.unshift(j);
    return j;
  }

  async function updateJob(jobId, patch) {
    const row = {};
    if (patch.title != null) row.title = patch.title;
    if (patch.seniority != null) row.seniority = patch.seniority;
    if (patch.location != null) row.location = patch.location;
    if (patch.workMode != null) row.work_mode = patch.workMode;
    if (patch.priority != null) row.priority = patch.priority;
    if (patch.status != null) row.status = patch.status;
    if (patch.description != null) row.description = patch.description;
    if (patch.requirements != null) row.requirements = patch.requirements;
    const { data, error } = await supabase.from('jobs').update(row).eq('id', jobId).select().single();
    if (error) { toast('Update job failed: ' + error.message, 'error'); return; }
    const idx = state.data.jobs.findIndex(j => j.id === jobId);
    if (idx >= 0) state.data.jobs[idx] = rowToJob(data);
  }

  async function deleteJob(jobId) {
    const { error } = await supabase.from('jobs').delete().eq('id', jobId);
    if (error) { toast('Delete failed: ' + error.message, 'error'); return; }
    state.data.jobs = state.data.jobs.filter(j => j.id !== jobId);
    state.data.applications = state.data.applications.filter(a => a.jobId !== jobId);
  }

  async function createCandidate(payload) {
    const row = {
      name: payload.name,
      email: payload.email || null,
      phone: payload.phone || null,
      current_title: payload.currentRole || null,
      current_company: payload.currentCompany || null,
      years_experience: payload.yearsExperience ?? null,
      skills: payload.skills || [],
      summary: payload.summary || null,
      source: payload.source || null,
    };
    const { data, error } = await supabase.from('candidates').insert(row).select().single();
    if (error) { toast('Create candidate failed: ' + error.message, 'error'); return null; }
    const k = rowToCandidate(data);
    state.data.candidates.unshift(k);
    return k;
  }

  async function updateCandidate(candidateId, patch) {
    const row = {};
    if (patch.name != null) row.name = patch.name;
    if (patch.email != null) row.email = patch.email;
    if (patch.phone != null) row.phone = patch.phone;
    if (patch.currentRole != null) row.current_title = patch.currentRole;
    if (patch.currentCompany != null) row.current_company = patch.currentCompany;
    if (patch.yearsExperience !== undefined) row.years_experience = patch.yearsExperience;
    if (patch.skills != null) row.skills = patch.skills;
    if (patch.summary != null) row.summary = patch.summary;
    if (patch.source != null) row.source = patch.source;
    if (patch.aiSummary !== undefined) row.ai_summary = patch.aiSummary;
    const { data, error } = await supabase.from('candidates').update(row).eq('id', candidateId).select().single();
    if (error) { toast('Update candidate failed: ' + error.message, 'error'); return; }
    const idx = state.data.candidates.findIndex(c => c.id === candidateId);
    if (idx >= 0) state.data.candidates[idx] = rowToCandidate(data);
  }

  async function deleteCandidate(candidateId) {
    const { error } = await supabase.from('candidates').delete().eq('id', candidateId);
    if (error) { toast('Delete failed: ' + error.message, 'error'); return; }
    state.data.candidates = state.data.candidates.filter(c => c.id !== candidateId);
    state.data.applications = state.data.applications.filter(a => a.candidateId !== candidateId);
  }

  async function createApplication(candidateId, jobId) {
    const exists = state.data.applications.find(a => a.candidateId === candidateId && a.jobId === jobId);
    if (exists) return exists;
    const { data, error } = await supabase.from('applications').insert({
      candidate_id: candidateId, job_id: jobId, stage: 'applied', strengths: [], gaps: [],
    }).select().single();
    if (error) { toast('Add application failed: ' + error.message, 'error'); return null; }
    const a = rowToApplication(data);
    state.data.applications.unshift(a);
    return a;
  }

  async function updateApplication(appId, patch) {
    const row = {};
    if (patch.stage != null) row.stage = patch.stage;
    if (patch.fitScore !== undefined) row.fit_score = patch.fitScore;
    if (patch.fitSummary !== undefined) row.fit_summary = patch.fitSummary;
    if (patch.strengths != null) row.strengths = patch.strengths;
    if (patch.gaps != null) row.gaps = patch.gaps;
    const { data, error } = await supabase.from('applications').update(row).eq('id', appId).select().single();
    if (error) { toast('Update failed: ' + error.message, 'error'); return; }
    const idx = state.data.applications.findIndex(a => a.id === appId);
    if (idx >= 0) state.data.applications[idx] = rowToApplication(data);
  }

  // =============================================================================
  // Selectors
  // =============================================================================
  function clientById(cid) { return state.data.clients.find(c => c.id === cid); }
  function jobById(jid)    { return state.data.jobs.find(j => j.id === jid); }
  function candidateById(kid) { return state.data.candidates.find(c => c.id === kid); }

  function visibleJobs() {
    if (!state.activeClientId) return state.data.jobs;
    return state.data.jobs.filter(j => j.clientId === state.activeClientId);
  }
  function applicationsForJob(jobId) {
    return state.data.applications.filter(a => a.jobId === jobId);
  }
  function applicationsForCandidate(candidateId) {
    return state.data.applications.filter(a => a.candidateId === candidateId);
  }

    return `<svg class="${cls} animate-spin" viewBox="0 0 24 24" fill="none">

  function clientChip(client) {
    if (!client) return '';
    const dot = CLIENT_COLORS[client.colorIdx % CLIENT_COLORS.length];
    return `<span class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-700">
      <span class="${dot} h-2 w-2 rounded-full"></span>${escapeHTML(client.name)}

  function fitScorePill(score) {
    if (score == null) return `<span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-500">No fit score</span>`;
    const cls = score >= 80 ? 'bg-emerald-100 text-emerald-700'
              : score >= 60 ? 'bg-blue-100 text-blue-700'
              : score >= 40 ? 'bg-amber-100 text-amber-700'
              : 'bg-rose-100 text-rose-700';
    return `<span class="inline-flex items-center gap-1 rounded-full ${cls} px-2 py-0.5 text-xs font-semibold tabular-nums">
      <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 8.5 22 9.3 17 14 18.5 21 12 17.8 5.5 21 7 14 2 9.3 9 8.5"/></svg>
      ${score}
    </span>`;
  }

  function bannerHTML() {
    if (state.error) return `<div role="alert" class="rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">${escapeHTML(state.error)}</div>`;
    if (state.info)  return `<div role="status" class="rounded-md border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm text-emerald-700">${escapeHTML(state.info)}</div>`;
    return '';
  }

  function mdToHtml(md) {
    if (!md) return '';
    // tiny markdown: ## headings, - lists, blank lines as paragraphs
    const lines = md.split('\n');
    let html = '', inList = false;
    for (let line of lines) {
      const trimmed = line.trim();
      if (trimmed.startsWith('## ')) {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<h4 class="mt-3 text-xs font-semibold uppercase tracking-wider text-slate-500">${escapeHTML(trimmed.slice(3))}</h4>`;
      } else if (trimmed.startsWith('- ')) {
        if (!inList) { html += '<ul class="mt-2 space-y-1 list-disc pl-5 text-sm text-slate-700">'; inList = true; }
        html += `<li>${escapeHTML(trimmed.slice(2))}</li>`;
      } else if (trimmed === '') {
        if (inList) { html += '</ul>'; inList = false; }
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<p class="mt-2 text-sm text-slate-700">${escapeHTML(trimmed)}</p>`;
      }
    }
    if (inList) html += '</ul>';
    return html;
  }

        </button>
        <h1 class="text-2xl font-semibold tracking-tight">New client</h1>
        <form id="client-form" class="mt-6 space-y-4 rounded-lg border border-slate-200 bg-white p-6">
          <div>
            <label class="mb-1.5 block text-sm font-medium">Client name <span class="text-red-500">*</span></label>
            <input name="name" type="text" required value="${escapeHTML(draft.name||'')}" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/20" />
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-medium">Industry</label>
            <input name="industry" type="text" value="${escapeHTML(draft.industry||'')}" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/20" placeholder="SaaS, Healthcare, Hardware, …" />
          </div>
          ${bannerHTML()}
          <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
            <button type="button" data-action="go" data-view="clients" class="rounded-md border border-slate-200 bg-white px-4 py-2 text-sm font-medium hover:bg-slate-50">Cancel</button>
            <button type="submit" class="rounded-md bg-brand-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-brand-700">Add client</button>
          </div>
        </form>
      </div>
    `);
  }

  // =============================================================================
  // Modals
  // =============================================================================
  function showModal(html, opts = {}) {
    state.modal = { html, opts };
    renderModal();
  }
  function closeModal() {
    state.modal = null;
    renderModal();
  }
  function renderModal() {
    const root = document.getElementById('modal-root');
    if (!state.modal) { root.innerHTML = ''; return; }
    root.innerHTML = `
      <div class="modal-backdrop fixed inset-0 z-40 bg-slate-900/40" data-action="close-modal"></div>
      <div class="fixed inset-0 z-50 flex items-center justify-center p-4 pointer-events-none">
        <div class="pointer-events-auto fade-in w-full ${state.modal.opts.size === 'lg' ? 'max-w-3xl' : 'max-w-md'} rounded-xl border border-slate-200 bg-white shadow-xl">
          ${state.modal.html}
        </div>
      </div>`;
    bindModalEvents();
  }

  function showAddCandidateModal(jobId) {
    const job = jobById(jobId);
    if (!job) return;
    const existingApps = applicationsForJob(jobId).map(a => a.candidateId);
    const eligible = state.data.candidates.filter(c => !existingApps.includes(c.id));
    showModal(`
      <div class="border-b border-slate-100 px-5 py-4">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-semibold">Add candidate to: ${escapeHTML(job.title)}</h3>
          <button data-action="close-modal" class="text-slate-400 hover:text-slate-600"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
      </div>
      <div class="max-h-[60vh] overflow-y-auto px-5 py-4">
        ${eligible.length === 0 ? `
          <p class="py-6 text-center text-sm text-slate-500">All your candidates are already on this job. <a href="#" data-action="close-and-go" data-view="candidateNew" class="font-medium text-brand-600">Add a new candidate?</a></p>
        ` : `
          <ul class="space-y-2">
            ${eligible.map(k => `
              <li>
                <button data-action="add-application" data-candidate="${k.id}" data-job="${jobId}" class="flex w-full items-start gap-3 rounded-md border border-slate-200 p-3 text-left hover:border-brand-300 hover:bg-brand-50/40">
                  <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-slate-100 text-xs font-semibold text-slate-600">${escapeHTML(initials(k.name))}</span>
                  <div class="min-w-0 flex-1">
                    <p class="truncate text-sm font-medium">${escapeHTML(k.name)}</p>
                    <p class="truncate text-xs text-slate-500">${escapeHTML(k.currentRole || '')}${k.yearsExperience ? ' · ' + k.yearsExperience + 'y' : ''}</p>
                  </div>
                  <span class="text-xs text-brand-600">Add →</span>
                </button>
              </li>`).join('')}
          </ul>
          <div class="mt-4 border-t border-slate-100 pt-4 text-center">
            <a href="#" data-action="close-and-go" data-view="candidateNew" class="text-xs font-medium text-brand-600">+ Add a new candidate</a>
          </div>
        `}
      </div>
    `, { size: 'lg' });
  }

  function showInterviewKitModal(questions) {
    const list = (questions || []).map((q, i) => `
      <article class="rounded-md border border-slate-200 p-3">
        <div class="flex items-start gap-2">
          <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full bg-brand-600 text-[10px] font-semibold text-white">${i+1}</span>
          <div class="min-w-0">
            <p class="text-sm font-medium leading-snug">${escapeHTML(q.question)}</p>
            <p class="mt-1 text-[11px] uppercase tracking-wider text-slate-500">${escapeHTML(q.competency || '')}</p>
            ${q.lookFor ? `<p class="mt-1.5 text-xs text-slate-600"><span class="font-medium">Look for:</span> ${escapeHTML(q.lookFor)}</p>` : ''}
          </div>
        </div>
      </article>`).join('');
    showModal(`
      <div class="border-b border-slate-100 px-5 py-4">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-semibold">AI-generated interview kit</h3>
          <button data-action="close-modal" class="text-slate-400 hover:text-slate-600"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
      </div>
      <div class="max-h-[70vh] space-y-3 overflow-y-auto px-5 py-4">${list || '<p class="text-sm text-slate-500">No questions generated.</p>'}</div>
      <div class="border-t border-slate-100 px-5 py-3 text-right">
        <button data-action="close-modal" class="rounded-md border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium hover:bg-slate-50">Close</button>
      </div>
    `, { size: 'lg' });
  }

  // =============================================================================
  // Master render
  // =============================================================================
  function render() {
    const root = document.getElementById('app');
    let html = '';
    switch (state.view) {
      case 'loading':         html = `<div class="auth-bg flex min-h-screen items-center justify-center"><div class="flex items-center gap-2 text-slate-500">${spinner('h-5 w-5')}<span class="text-sm">Loading…</span></div></div>`; break;
      case 'login':           html = renderLogin(); break;
      case 'signup':          html = renderSignup(); break;
      case 'dashboard':       html = renderDashboard(); break;
      case 'jobs':            html = renderJobs(); break;
      case 'jobNew':          html = renderJobNew(); break;
      case 'jobDetail':       html = renderJobDetail(); break;
      case 'candidates':      html = renderCandidates(); break;
      case 'candidateNew':    html = renderCandidateNew(); break;
      case 'candidateDetail': html = renderCandidateDetail(); break;
      case 'clients':         html = renderClients(); break;
      case 'clientNew':       html = renderClientNew(); break;
      default:                html = renderDashboard();
    }
    root.innerHTML = html;
    bindEvents();
  }

  // =============================================================================
  // Event binding (delegation)
  // =============================================================================
  function bindEvents() {
    document.body.onclick = (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;

      const action = target.dataset.action;

      if (action === 'go') {
        e.preventDefault();
        const view = target.dataset.view;
        const params = {};
        if (target.dataset.job) params.jobId = target.dataset.job;
        if (target.dataset.candidate) params.candidateId = target.dataset.candidate;
        go(view, params);
      } else if (action === 'signout') {
        e.preventDefault();
        handleSignout();
      } else if (action === 'toggle-client-switcher') {
        document.getElementById('client-switcher')?.classList.toggle('hidden');
      } else if (action === 'set-client') {
        state.activeClientId = target.dataset.client || null;
        document.getElementById('client-switcher')?.classList.add('hidden');
        render();
      } else if (action === 'set-client-and-go') {
        state.activeClientId = target.dataset.client;
        go('jobs');
      } else if (action === 'ai-generate-jd') {
        e.preventDefault();
        handleAIGenerateJD();
      } else if (action === 'ai-parse-resume') {
        e.preventDefault();
        handleAIParseResume();
      } else if (action === 'ai-fit') {
        e.preventDefault();
        handleAIFit(target.dataset.app);
      } else if (action === 'ai-interview-kit') {
        e.preventDefault();
        handleAIInterviewKit(target.dataset.job);
      } else if (action === 'ai-summary') {
        e.preventDefault();
        handleAICandidateSummary(target.dataset.candidate);
      } else if (action === 'open-add-candidate') {
        e.preventDefault();
        showAddCandidateModal(target.dataset.job);
      } else if (action === 'add-application') {
        e.preventDefault();
        handleAddApplication(target.dataset.candidate, target.dataset.job);
      } else if (action === 'close-modal') {
        closeModal();
      } else if (action === 'close-and-go') {
        e.preventDefault();
        const view = target.dataset.view;
        closeModal();
        go(view);
      }
    };

    document.body.onchange = async (e) => {
      const target = e.target.closest('[data-action="move-stage"]');
      if (!target) return;
      const appId = target.dataset.app;
      const newStage = target.value;
      await updateApplication(appId, { stage: newStage });
      toast('Stage updated', 'success');
      render();
    };

    // Close client-switcher when clicking outside
    document.addEventListener('click', (e) => {
      const sw = document.getElementById('client-switcher');
      if (sw && !sw.classList.contains('hidden')) {
        if (!e.target.closest('#client-switcher') && !e.target.closest('[data-action="toggle-client-switcher"]')) {
          sw.classList.add('hidden');
        }
      }
    }, { once: true });

    const lf = document.getElementById('login-form');
    if (lf) lf.onsubmit = (e) => { e.preventDefault(); handleLogin(lf); };
    const sf = document.getElementById('signup-form');
    if (sf) sf.onsubmit = (e) => { e.preventDefault(); handleSignup(sf); };
    const jf = document.getElementById('job-form');
    if (jf) jf.onsubmit = (e) => { e.preventDefault(); handleJobSubmit(jf); };
    const cf = document.getElementById('candidate-form');
    if (cf) cf.onsubmit = (e) => { e.preventDefault(); handleCandidateSubmit(cf); };
    const clf = document.getElementById('client-form');
    if (clf) clf.onsubmit = (e) => { e.preventDefault(); handleClientSubmit(clf); };
  }

  function bindModalEvents() {
    // Modal events use the same delegated handler via bindEvents.
  }

  // =============================================================================
  // Form & AI handlers
  // =============================================================================
  async function handleJobSubmit(form) {
    const fd = new FormData(form);
    const payload = {
      title: (fd.get('title')||'').toString().trim(),
      clientId: (fd.get('clientId')||'').toString(),
      seniority: (fd.get('seniority')||'').toString(),
      location: (fd.get('location')||'').toString().trim(),
      workMode: (fd.get('workMode')||'').toString(),
      priority: (fd.get('priority')||'medium').toString(),
      description: (fd.get('description')||'').toString(),
      requirements: (fd.get('requirements')||'').toString(),
    };
    if (!payload.title) { state.error = 'Title is required.'; render(); return; }
    if (!payload.clientId) { state.error = 'Client is required.'; render(); return; }
    const job = await createJob(payload);
    toast('Job created', 'success');
    go('jobDetail', { jobId: job.id });
  }

  async function handleCandidateSubmit(form) {
    const fd = new FormData(form);
    const skillsStr = (fd.get('skills')||'').toString();
    const yrs = (fd.get('yearsExperience')||'').toString();
    const payload = {
      name: (fd.get('name')||'').toString().trim(),
      email: (fd.get('email')||'').toString().trim(),
      phone: (fd.get('phone')||'').toString().trim(),
      currentRole: (fd.get('currentRole')||'').toString().trim(),
      currentCompany: (fd.get('currentCompany')||'').toString().trim(),
      yearsExperience: yrs ? parseInt(yrs, 10) : null,
      source: (fd.get('source')||'').toString().trim(),
      summary: (fd.get('summary')||'').toString().trim(),
      skills: skillsStr.split(',').map(s => s.trim()).filter(Boolean),
    };
    if (!payload.name) { state.error = 'Name is required.'; render(); return; }
    const k = await createCandidate(payload);
    toast('Candidate added', 'success');
    go('candidateDetail', { candidateId: k.id });
  }

  async function handleClientSubmit(form) {
    const fd = new FormData(form);
    const name = (fd.get('name')||'').toString().trim();
    const industry = (fd.get('industry')||'').toString().trim();
    if (!name) { state.error = 'Name is required.'; render(); return; }
    await createClient({ name, industry });
    toast('Client added', 'success');
    go('clients');
  }

  async function handleAIGenerateJD() {
    const form = document.getElementById('job-form');
    const brief = document.getElementById('ai-brief')?.value || '';
    const fd = new FormData(form);
    const title = (fd.get('title')||'').toString().trim();
    if (!title) { toast('Add a job title first', 'error'); return; }
    const clientId = (fd.get('clientId')||'').toString();
    const client = clientById(clientId);

    state.aiLoading.jd = true; render();
    // Re-fill brief field
    const briefEl = document.getElementById('ai-brief');
    if (briefEl) briefEl.value = brief;

    try {
      const result = await aiGenerateJD({
        title,
        seniority: (fd.get('seniority')||'').toString(),
        location: (fd.get('location')||'').toString(),
        workMode: (fd.get('workMode')||'').toString(),
        clientName: client?.name,
        industry: client?.industry,
        brief,
      });
      // Save current draft + AI output, re-render the form with values
      const draft = {
        title,
        clientId,
        seniority: (fd.get('seniority')||'').toString(),
        location: (fd.get('location')||'').toString(),
        workMode: (fd.get('workMode')||'').toString(),
        priority: (fd.get('priority')||'medium').toString(),
        description: result.description || '',
        requirements: result.requirements || '',
      };
      state.aiLoading.jd = false;
      go('jobNew', { draft });
      toast('JD drafted by AI — review and edit before saving', 'success');
    } catch (err) {
      state.aiLoading.jd = false;
      render();
      toast('AI failed: ' + err.message, 'error');
    }
  }

  async function handleAIParseResume() {
    const text = document.getElementById('ai-resume')?.value?.trim() || '';
    if (text.length < 30) { toast('Paste at least a few lines of resume text', 'error'); return; }
    state.aiLoading.parse = true; render();
    // re-fill the textarea after re-render below would erase it; we accept this trade-off
    try {
      const parsed = await aiParseResume(text);
      const draft = {
        name: parsed.name || '',
        email: parsed.email || '',
        phone: parsed.phone || '',
        currentRole: parsed.currentRole || '',
        currentCompany: parsed.currentCompany || '',
        yearsExperience: parsed.yearsExperience ?? null,
        skills: Array.isArray(parsed.skills) ? parsed.skills : [],
        summary: parsed.summary || '',
        source: 'AI-parsed',
      };
      state.aiLoading.parse = false;
      go('candidateNew', { draft });
      toast('Resume parsed — review the fields before saving', 'success');
    } catch (err) {
      state.aiLoading.parse = false;
      render();
      toast('AI failed: ' + err.message, 'error');
    }
  }

  async function handleAIFit(appId) {
    const a = state.data.applications.find(x => x.id === appId);
    if (!a) return;
    const k = candidateById(a.candidateId);
    const j = jobById(a.jobId);
    if (!k || !j) return;
    state.aiLoading['fit:'+appId] = true; render();
    try {
      const result = await aiFitScore({ candidate: k, job: j });
      await updateApplication(appId, {
        fitScore: typeof result.score === 'number' ? Math.round(result.score) : null,
        fitSummary: result.summary || null,
        strengths: Array.isArray(result.strengths) ? result.strengths : [],
        gaps: Array.isArray(result.gaps) ? result.gaps : [],
      });
      delete state.aiLoading['fit:'+appId];
      toast(`Fit score: ${result.score}`, 'success');
      render();
    } catch (err) {
      delete state.aiLoading['fit:'+appId];
      render();
      toast('AI failed: ' + err.message, 'error');
    }
  }

  async function handleAIInterviewKit(jobId) {
    const job = jobById(jobId);
    if (!job) return;
    state.aiLoading.kit = true; render();
    try {
      const result = await aiInterviewQuestions(job);
      state.aiLoading.kit = false;
      render();
      showInterviewKitModal(result.questions || []);
    } catch (err) {
      state.aiLoading.kit = false;
      render();
      toast('AI failed: ' + err.message, 'error');
    }
  }

  async function handleAICandidateSummary(candidateId) {
    const k = candidateById(candidateId);
    if (!k) return;
    state.aiLoading['summary:'+candidateId] = true; render();
    try {
      const apps = applicationsForCandidate(candidateId);
      const summary = await aiCandidateSummary({ candidate: k, applications: apps, jobs: state.data.jobs });
      delete state.aiLoading['summary:'+candidateId];
      // Also persist on the candidate
      await updateCandidate(candidateId, { aiSummary: summary });
      go('candidateDetail', { candidateId, aiSummary: summary });
      toast('Summary generated', 'success');
    } catch (err) {
      delete state.aiLoading['summary:'+candidateId];
      render();
      toast('AI failed: ' + err.message, 'error');
    }
  }

  async function handleAddApplication(candidateId, jobId) {
    await createApplication(candidateId, jobId);
    closeModal();
    toast('Candidate added to job', 'success');
    render();
  }

  // =============================================================================
  // Init
  // =============================================================================
  async function init() {
    try {
      await initSupabase();
    } catch (e) {
      state.view = 'login';
      state.error = e.message;
      render();
      return;
    }

    const user = await getCurrentUser();
    if (user) {
      state.user = user;
      try {
        state.data = await loadOrSeedData();
        state.activeClientId = null;
        state.view = 'dashboard';
      } catch (e) {
        state.view = 'login';
        state.error = 'Workspace load failed: ' + e.message;
      }
    } else {
      state.view = 'login';
    }
    render();

    // React to sign-out from another tab
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT' && state.user) {
        state.user = null;
        state.data = { clients: [], jobs: [], candidates: [], applications: [] };
        state.activeClientId = null;
        state.view = 'login';
        render();
      }
    });
  }

  init();
</script>
</body>
</html>
